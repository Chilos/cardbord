<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#51cf66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#cardGradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Grid cards -->
  <!-- Top row -->
  <rect x="6" y="7" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="19" y="7" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  
  <!-- Middle row -->
  <rect x="6" y="14" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="19" y="14" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  
  <!-- Bottom row -->
  <rect x="6" y="21" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  <rect x="19" y="21" width="7" height="5" rx="1" fill="#ffffff" opacity="0.9"/>
  
  <!-- Grid lines -->
  <line x1="16" y1="7" x2="16" y2="26" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="12.5" x2="26" y2="12.5" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  <line x1="6" y1="19.5" x2="26" y2="19.5" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
  
  <!-- Drag indicator dots -->
  <circle cx="9.5" cy="9.5" r="0.8" fill="#0066cc" opacity="0.7"/>
  <circle cx="22.5" cy="9.5" r="0.8" fill="#4ecdc4" opacity="0.7"/>
  <circle cx="9.5" cy="16.5" r="0.8" fill="#51cf66" opacity="0.7"/>
  <circle cx="22.5" cy="16.5" r="0.8" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="9.5" cy="23.5" r="0.8" fill="#9775fa" opacity="0.7"/>
  <circle cx="22.5" cy="23.5" r="0.8" fill="#ffd93d" opacity="0.7"/>
</svg>
